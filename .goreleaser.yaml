version: 2
project_name: deutero-pp-cli
changelog:
  disable: true
builds:
  - id: deutero-pp-cli
    main: ./cmd/deutero-pp-cli
    binary: deutero-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X deutero-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: deutero-pp-mcp
    main: ./cmd/deutero-pp-mcp
    binary: deutero-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: deutero-pp-cli
    repository:
      owner: francisjervis
      name: homebrew-tap
    homepage: "https://github.com/francisjervis/deutero-pp-cli"
    description: "Every Deutero endpoint, plus the flow-behaviour and fielding answers that take many API calls to assemble and that no single endpoint returns."
    install: |
      bin.install "deutero-pp-cli"
      bin.install "deutero-pp-mcp"
