version: 2
project_name: deutero-pp-cli
changelog:
  disable: true
builds:
  - id: deutero-pp-cli
    main: ./cmd/deutero-pp-cli
    binary: deutero-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/deutero-ai/deutero-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
  - id: deutero-pp-mcp
    main: ./cmd/deutero-pp-mcp
    binary: deutero-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: deutero-pp-cli
    repository:
      owner: deutero-ai
      name: homebrew-deutero-cli
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    commit_author:
      name: deutero-ai-bot
      email: actions@github.com
    homepage: "https://github.com/deutero-ai/deutero-cli"
    description: "Every Deutero endpoint, plus the flow-behaviour and fielding answers that take many API calls to assemble and that no single endpoint returns."
    install: |
      bin.install "deutero-pp-cli"
      bin.install "deutero-pp-mcp"
    test: |
      system "#{bin}/deutero-pp-cli", "version"
